<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../layout/main.css" />
    <link rel="stylesheet" href="../layout/main_scoreboard/index.css" />
    <style>
      html { width: 100%; height: 100%; overflow: hidden; background: #050307; }
      body { opacity: 1; background: radial-gradient(circle at 50% 0%, rgba(80, 200, 120, 0.16), transparent 34%), #050307; transform: scale(calc(100vw / 1920)); transform-origin: top left; }
      .sponsor_icon::before { content: ""; position: absolute; inset: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--emerald), var(--magenta)); box-shadow: 0 0 24px rgba(80, 200, 120, 0.45); }
      .p2 .sponsor_icon::before { background: linear-gradient(135deg, var(--p2-score-bg-color), var(--magenta)); }
      .crew_chars .tsh_character > div { background: linear-gradient(135deg, rgba(80, 200, 120, 0.95), rgba(200, 80, 160, 0.85)); }
      .crew_chars .tsh_character:nth-child(2) > div { background: linear-gradient(135deg, rgba(46, 137, 255, 0.95), rgba(80, 200, 120, 0.75)); }
      .crew_chars .tsh_character:nth-child(3) > div { background: linear-gradient(135deg, rgba(254, 54, 54, 0.95), rgba(200, 80, 160, 0.75)); }
    </style>
  </head>
  <body class="ssbu">
    <div class="logo"></div>
    <div class="anim_container_outer">
      <div class="anim_container_inner">
        <div class="p1 series_score diamond container"><div class="value">1</div></div>
        <div class="p1 player container">
          <div class="sponsor_icon"></div>
          <div class="score_name"><div class="score">12</div><div class="sponsor">NOVA</div></div>
        </div>
        <div class="p2 series_score diamond container"><div class="value">0</div></div>
        <div class="p2 player container">
          <div class="sponsor_icon"></div>
          <div class="score_name"><div class="score">08</div><div class="sponsor">FLX</div></div>
        </div>
        <div class="crew_box container">
          <div class="crew_team t1">
            <div class="crew_active_name p1_crew_name">Nova Captain</div>
            <div class="crew_chars p1_crew_chars">
              <div class="tsh_character active_char"><div></div></div>
              <div class="tsh_character"><div></div></div>
              <div class="tsh_character eliminated"><div></div></div>
              <div class="tsh_character"><div></div></div>
            </div>
          </div>
          <div class="crew_team t2">
            <div class="crew_active_name p2_crew_name">Flux Anchor</div>
            <div class="crew_chars p2_crew_chars">
              <div class="tsh_character active_char"><div></div></div>
              <div class="tsh_character"><div></div></div>
              <div class="tsh_character"><div></div></div>
              <div class="tsh_character eliminated"><div></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
